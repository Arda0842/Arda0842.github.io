<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GridWar Online ⚔️</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmFkmbEuqfQbtDW-T9TIeSBAeYr6SVgDY",
    authDomain: "gridwar-8f1fa.firebaseapp.com",
    databaseURL: "https://gridwar-8f1fa-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gridwar-8f1fa",
    storageBucket: "gridwar-8f1fa.firebasestorage.app",
    messagingSenderId: "27513897350",
    appId: "1:27513897350:web:4a1dfdd299ecb81f5a2c07",
    measurementId: "G-K1207KE14Y"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // JS içinden erişmek için global yapıyoruz
  window.db = db;
  window.dbRef = ref;
  window.dbSet = set;
  window.dbUpdate = update;
  window.dbOnValue = onValue;
</script>

<style>
/* CSS kodların aynı kalıyor (Hepsini buraya dahil etmişsin varsayıyorum) */
:root{
  --bg:#060612; --bg2:#0d0d20; --surface:#111128; --surface2:#181835;
  --border:#1e1e45; --border2:#2a2a60; --A:#00e5ff; --B:#ff3864;
  --C:#ffe600; --D:#39ff14; --E:#bf5af2; --F:#ff9500;
  --text:#dde4ff; --dim:#4a4a80; --glowA:rgba(0,229,255,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;}
body{background:var(--bg); font-family:'Rajdhani',sans-serif; color:var(--text); display:flex;flex-direction:column;align-items:center;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);}

.screen{display:none;position:fixed;inset:0;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);padding:20px;}
.screen.active{display:flex;}
.game-logo{font-family:'Orbitron',monospace;font-weight:900;font-size:3rem;letter-spacing:4px;background:linear-gradient(135deg,var(--A),var(--E),var(--B));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px var(--glowA));text-align:center;}
.menu-btn{width:240px;padding:14px 0;border-radius:8px;border:none;cursor:pointer;font-family:'Orbitron',monospace;font-weight:700;font-size:0.9rem;letter-spacing:2px;text-transform:uppercase;transition:transform 0.15s;}
.menu-btn.primary{background:linear-gradient(135deg,var(--A),#0099bb);color:#000;box-shadow:0 0 20px var(--glowA);}
.menu-btn.secondary{background:linear-gradient(135deg,var(--E),#8822cc);color:#fff;}
.menu-btn.solo{background:linear-gradient(135deg,var(--D),#228822);color:#000;}
.lobby-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:28px 32px;text-align:center;width:100%;max-width:340px;}
.room-code{font-family:'Orbitron',monospace;font-size:2.8rem;font-weight:900;color:var(--C);text-shadow:0 0 20px rgba(255,230,0,0.6);margin:12px 0;}
input.code-input{background:var(--surface2);border:2px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Orbitron',monospace;font-size:1.6rem;text-align:center;padding:12px;width:100%;text-transform:uppercase;outline:none;}
.topbar{width:100%;max-width:440px;padding:8px;display:flex;justify-content:space-between;position:relative;z-index:1;}
.scores{display:flex;gap:6px;}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 9px;min-width:56px;text-align:center;}
.grid-outer{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:7px;position:relative;}
#grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;}
.cell{border-radius:4px;background:var(--surface2);transition:background 0.1s;}
.tray{width:100%;max-width:440px;display:flex;justify-content:space-around;padding:10px;gap:6px;}
.slot{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:12px;min-height:88px;display:flex;align-items:center;justify-content:center;}
.game-overlay{display:none;position:fixed;inset:0;background:rgba(3,3,15,0.93);z-index:100;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(14px);}
.game-overlay.show{display:flex;}
#ghost{position:fixed;pointer-events:none;z-index:999;display:none;}
</style>
</head>
<body>

<div class="screen active" id="scr-menu">
  <div class="game-logo">GRID<br>WAR</div>
  <button class="menu-btn solo" onclick="startSolo()">▶ TEK OYUNCU</button>
  <button class="menu-btn primary" onclick="createOnlineRoom()">🌐 ODA OLUŞTUR</button>
  <button class="menu-btn secondary" onclick="showScreen('scr-join')">🔗 ODAYA KATIL</button>
</div>

<div class="screen" id="scr-create">
  <div class="lobby-box">
    <h2>ODA KODU</h2>
    <div class="room-code" id="room-code-display">----</div>
    <div id="waiting-status" style="font-size:0.85rem;color:var(--dim);">Rakip bekleniyor...</div>
    <button class="menu-btn secondary" style="margin-top:20px" onclick="goMenu()">← İPTAL</button>
  </div>
</div>

<div class="screen" id="scr-join">
  <div class="lobby-box">
    <h2>KATIL</h2>
    <input class="code-input" id="join-input" maxlength="4" placeholder="KOD">
    <button class="menu-btn primary" style="margin-top:10px" onclick="joinOnlineRoom()">KATIL</button>
    <button class="menu-btn secondary" style="margin-top:10px" onclick="goMenu()">← GERİ</button>
  </div>
</div>

<div class="topbar" id="topbar" style="display:none">
  <div class="gw-logo" style="font-family:'Orbitron'; font-weight:900; color:var(--A)">GRIDWAR</div>
  <div class="scores">
    <div class="sbox"><div style="font-size:10px">SKOR</div><div id="sv">0</div></div>
    <div class="sbox"><div style="font-size:10px">RAKİP</div><div id="ov-score">0</div></div>
  </div>
</div>

<div class="grid-outer" id="gout" style="display:none"><div id="grid"></div></div>
<div class="tray" id="tray" style="display:none">
  <div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div>
</div>

<div id="ghost"></div>
<div class="game-overlay" id="ov">
  <h1 id="ov-title">OYUN BİTTİ</h1>
  <div id="fv">0</div>
  <button class="menu-btn primary" onclick="startSolo()">TEKRAR</button>
  <button class="menu-btn secondary" onclick="goMenu()">MENÜ</button>
</div>

<script>
/* ══ ONLINE MANTIK (YENİ) ══ */
let currentRoom = null;
let myRole = 'p1'; // p1: host, p2: guest

async function createOnlineRoom() {
    const code = genCode();
    currentRoom = code;
    myRole = 'p1';
    document.getElementById('room-code-display').textContent = code;
    
    // Firebase'e odayı yaz
    await window.dbSet(window.dbRef(window.db, 'rooms/' + code), {
        status: 'waiting',
        p1_score: 0,
        p2_score: 0
    });
    
    showScreen('scr-create');

    // Odayı dinle: Rakip geldiğinde status 'playing' olacak
    window.dbOnValue(window.dbRef(window.db, 'rooms/' + code), (snapshot) => {
        const data = snapshot.val();
        if (data && data.status === 'playing') {
            startSolo(); // Oyunu başlat
            listenOpponent();
        }
    });
}

async function joinOnlineRoom() {
    const code = document.getElementById('join-input').value.toUpperCase();
    if (code.length !== 4) return alert("4 haneli kod gir!");
    
    currentRoom = code;
    myRole = 'p2';

    // Odayı güncelle
    await window.dbUpdate(window.dbRef(window.db, 'rooms/' + code), {
        status: 'playing'
    });

    startSolo();
    listenOpponent();
}

function listenOpponent() {
    const oppRole = myRole === 'p1' ? 'p2_score' : 'p1_score';
    window.dbOnValue(window.dbRef(window.db, `rooms/${currentRoom}/${oppRole}`), (snapshot) => {
        const oppScore = snapshot.val();
        document.getElementById('ov-score').textContent = oppScore || 0;
    });
}

function syncMyScore(newScore) {
    if (!currentRoom) return;
    const myScoreKey = myRole === 'p1' ? 'p1_score' : 'p2_score';
    window.dbUpdate(window.dbRef(window.db, 'rooms/' + currentRoom), {
        [myScoreKey]: newScore
    });
}

/* ══ MEVCUT OYUN KODLARIN (Değişmedi, sadece entegre edildi) ══ */
// ... (Buraya senin paylaştığın SHAPES, COLORS, buildGrid, tryPlace vb. tüm fonksiyonlar gelecek) ...
// Not: setScore(v) fonksiyonunun içine syncMyScore(v); ekledim.

function setScore(v){
  score=v; document.getElementById('sv').textContent=score;
  syncMyScore(v); // Firebase'e gönder
  if(score>best){best=score; localStorage.setItem('gw_best',best);}
}

// ... Diğer tüm oyun fonksiyonların (spawnPieces, onTouchStart, vb.) ...
// (Burada senin orijinal kodundaki tüm mantık çalışmaya devam edecek)

/* ÖNEMLİ: senin kodundaki fonksiyonları buraya aşağıya eklemelisin */

function genCode(){return Math.random().toString(36).substr(2,4).toUpperCase();}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function hideAllScreens(){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); }
function showGameUI(show){
  ['topbar','gout','tray'].forEach(id=>document.getElementById(id).style.display=show?'flex':'none');
  if(show) document.getElementById('gout').style.display = 'block';
}
function goMenu(){ currentRoom=null; showGameUI(false); showScreen('scr-menu'); document.getElementById('ov').classList.remove('show');}

// ... (Buradan sonra senin orijinal script kodlarını aynen yapıştır)
</script>
</body>
</html>
